; KnBle Bluetooth classic test bench: the Serial Port Profile server driven by the sample app (testbench/README.md).
; Classic ESP32 only (BR/EDR), here an ESP32 D1 Mini (ESP-WROOM-32): the ESP32-C3 has no Bluetooth classic. Bluetooth
; classic only (the BLE bench is the ESP32-C3 one, testbench/esp32-c3).
; Build and flash: pio run -t upload, logs: pio device monitor
[env:d1_mini32_classic]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
