; KnBle BLE test bench: the BLE peripheral driven by the sample app to benchmark and stress KnBle (testbench/README.md).
; Board: Seeed XIAO ESP32-C3 (Bluetooth 5: 2M PHY, data length extension; single core, native USB). Keep its antenna
; plugged on the U.FL connector, or the phones right next to it.
; Build and flash: pio run -t upload, logs: pio device monitor
[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
; 48 NimBLE buffers instead of 12 (the long writes at MTU 23): include/nimble_buffers.h
build_flags =
	-include "$PROJECT_DIR/include/nimble_buffers.h"
